# Local development services. Start with `pnpm db:up` (needs .env.local, see scripts/init-env.sh).
# Both ports are bound to 127.0.0.1 only: nothing is reachable from the network (security control 3).
name: nestvault

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      # Host port 5433 (not 5432) so it does not clash with a Postgres already running on a developer
      # machine, including the Mac end of the SSH tunnel. Inside the container Postgres stays on 5432.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm env:init to create .env.local}
      IDENTITY_RW_PASSWORD: ${IDENTITY_RW_PASSWORD:?run pnpm env:init to create .env.local}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?run pnpm env:init to create .env.local}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?run pnpm env:init to create .env.local}
      WORKER_RW_PASSWORD: ${WORKER_RW_PASSWORD:?run pnpm env:sync to add it to .env.local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # web UI

  # Statement parser (NES-56, security control 21). It sits on a network with no route out, has no
  # volumes and no database credentials, a read-only root filesystem, a small tmpfs, no capabilities
  # and hard CPU/memory/process limits. Build: docker compose build parser.
  parser:
    build: ./services/parser
    image: nestvault-parser:dev
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      PARSER_SECRET: ${PARSER_SECRET:?run pnpm env:sync to add it to .env.local}
    networks:
      - parser-internal

  # The only way in: a TCP forwarder published on 127.0.0.1 only. The parser itself is never
  # published and cannot open connections out, so only this forwarder can be reached from the host.
  parser-gateway:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    command: ['TCP-LISTEN:8000,fork,reuseaddr', 'TCP:parser:8000']
    ports:
      - '127.0.0.1:8100:8000'
    depends_on:
      parser:
        condition: service_healthy
    networks:
      - parser-internal
      - default

networks:
  # internal: true = no gateway, so containers on it cannot reach the internet (or the host).
  parser-internal:
    internal: true

volumes:
  postgres-data:
