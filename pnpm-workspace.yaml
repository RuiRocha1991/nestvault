packages:
  - apps/*
  - packages/*

# Security control 20: dependency install scripts do not run unless listed here.
# Explicitly skipped: unrs-resolver ships prebuilt native binaries, its install script is a fallback.
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  esbuild: false
  unrs-resolver: false

# Next.js pins an old postcss internally (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849); use the patched one.
overrides:
  'next>postcss': '8.5.29'

auditConfig:
  ignoreGhsas:
    # braces: stack exhaustion on deeply nested glob patterns. No patched version exists. It is only
    # reached through Tailwind 3's build-time file scanner, which globs our own source tree (trusted
    # input, never user input, never at runtime). Revisit when braces is patched or Tailwind 4 is adopted.
    - GHSA-vfj7-8cjw-p6xm
