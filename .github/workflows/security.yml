name: security

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Audit, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: No secrets in NEXT_PUBLIC_ variables
        run: |
          if grep -rEho 'NEXT_PUBLIC_[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD)[A-Z0-9_]*' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='.env.example' \
               --exclude-dir=node_modules --exclude-dir=.next . ; then
            echo "::error::Secret-looking NEXT_PUBLIC_ variable found"; exit 1
          fi
      # The integration tests (RLS, pool isolation) need the same Postgres as local development.
      - name: Start Postgres and Mailpit
        run: |
          pnpm env:init
          pnpm db:up
      - name: Apply migrations
        run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: OpenAPI document is up to date
        run: pnpm openapi --check
      # Unit + integration tests with coverage; fails below the thresholds in vitest.config.ts
      # (packages/domain 90% lines, packages/services 80% lines).
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; const row=k=>k+': '+t[k].pct+'% ('+t[k].covered+'/'+t[k].total+')'; console.log('### Coverage\n\n'+['lines','statements','functions','branches'].map(row).join('  \n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --no-color postgres | tail -n 100

  e2e:
    name: Browser checks (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web build and server read the same validated environment as the other job.
      - run: pnpm env:init
      # The sign-in specs need the `_test` databases (global-setup.ts migrates and seeds them).
      - name: Start Postgres and Mailpit
        run: pnpm db:up
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads Chromium only when the cache missed; the system dependencies are always installed.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Builds the web app and starts it on port 4010 (see playwright.config.ts).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
