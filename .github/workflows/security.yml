name: security

# Actions minutes are limited (NES-141): pull requests are the gate, so there is no run on push to dev
# (the PR already ran the same checks), a new push cancels the previous run of the same PR, and
# docs-only changes skip the heavy jobs. The Playwright job runs for PRs to master, manual runs
# and PRs that touch the web app. Skipped jobs count as passed for required checks.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  checks: write # lets the JUnit report step publish a check with the per-test results

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # On a pull request the checkout is the merge commit: HEAD^1 is the tip of the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=true
          e2e=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            # docs-only: Markdown, ADRs and the prototype (docs/api/openapi.json is still checked)
            if ! echo "$files" | grep -qvE '\.md$|^docs/(adr|prototype)/'; then
              code=false
            fi
            if [ "$BASE_REF" != "master" ] \
               && ! echo "$files" | grep -qE '^(apps/web|packages/ui|design|tests/e2e)/|^playwright\.config\.ts$|^pnpm-lock\.yaml$'; then
              e2e=false
            fi
          fi
          if [ "$code" = false ]; then e2e=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Audit, lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: No secrets in NEXT_PUBLIC_ variables
        run: |
          if grep -rEho 'NEXT_PUBLIC_[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD)[A-Z0-9_]*' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='.env.example' \
               --exclude-dir=node_modules --exclude-dir=.next . ; then
            echo "::error::Secret-looking NEXT_PUBLIC_ variable found"; exit 1
          fi
      # The integration tests (RLS, pool isolation) need the same Postgres as local development.
      - name: Start Postgres and Mailpit
        run: |
          pnpm env:init
          pnpm db:up
      - name: Apply migrations
        run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: OpenAPI document is up to date
        run: pnpm openapi --check
      # Unit + integration tests with coverage; fails below the thresholds in vitest.config.ts
      # (packages/domain 90% lines, packages/services 80% lines).
      - name: Tests with coverage
        run: pnpm test:coverage --reporter=default --reporter=junit --outputFile.junit=reports/junit-vitest.xml
      # Timing test: it skips itself under coverage, so it runs here on its own (NES-49).
      - name: Overview benchmark (no coverage)
        run: pnpm exec vitest run tests/services/overview-benchmark.integration.test.ts
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit-vitest.xml
          check_name: Test results (Vitest)
          detailed_summary: true
          fail_on_failure: false
          require_tests: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-vitest
          path: reports/junit-vitest.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Attach report to the Jira issue
        if: always()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: bash scripts/ci/attach-junit-to-jira.sh "$BRANCH" reports/junit-vitest.xml junit-vitest
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; const row=k=>k+': '+t[k].pct+'% ('+t[k].covered+'/'+t[k].total+')'; console.log('### Coverage\n\n'+['lines','statements','functions','branches'].map(row).join('  \n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --no-color postgres | tail -n 100

  e2e:
    name: Browser checks (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web build and server read the same validated environment as the other job.
      - run: pnpm env:init
      # The sign-in specs need the `_test` databases (global-setup.ts migrates and seeds them).
      - name: Start Postgres and Mailpit
        run: pnpm db:up
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads Chromium only when the cache missed; the system dependencies are always installed.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Builds the web app and starts it on port 4010 (see playwright.config.ts).
      - run: pnpm test:e2e
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit-e2e.xml
          check_name: Test results (Playwright)
          detailed_summary: true
          fail_on_failure: false
          require_tests: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: reports/junit-e2e.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Attach report to the Jira issue
        if: always()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: bash scripts/ci/attach-junit-to-jira.sh "$BRANCH" reports/junit-e2e.xml junit-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
